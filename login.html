<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Absen Guru MMU</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="login-container">
    
    <!-- SISI KIRI: FORM LOGIN -->
    <div class="login-left-form">
      <div class="form-content">
        <div class="form-header">
          <img src="assets/logo.png" alt="Logo" class="form-logo">
          <h2>Selamat Datang</h2>
          <p class="subtitle">Masuk ke Sistem Absensi MMU</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Masukkan username" required autocomplete="off">
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-toggle-wrapper">
              <input type="password" id="password" placeholder="Masukkan password" required>
              <button type="button" class="toggle-password-btn" id="togglePassword">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full">
            Masuk
          </button>
        </form>
      </div>
    </div>

    <!-- SISI KANAN: BRANDING -->
    <div class="login-right-branding">
      <div class="branding-content">
        <img src="assets/logo.png" alt="Logo AL ANWAR" class="branding-logo">
        <h1>MMU B-10 PATEREMAN</h1>
        <p class="branding-subtitle">Patereman Modung Bangkalan</p>
        <div class="accent-line"></div>
        <p class="branding-quote">"Terwujudnya Generasi Muslim Yang Kaffah dan Berakhlaqul Karimah."</p>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script>
    lucide.createIcons();

    // ==================================================
    // REDIRECT JIKA SUDAH LOGIN (SESUAI ROLE)
    // ==================================================
    const currentSession = Auth.getSession();
    if (currentSession) {
      if (currentSession.role === 'pembaca_rekap') {
        window.location.href = 'rekap.html';
      } else if (currentSession.role.startsWith('pengabsen_')) {
        window.location.href = 'absen.html'; // Pengabsen langsung ke Absen
      } else {
        window.location.href = 'index.html';
      }
    }

    // Cek pesan dari halaman lain (misal: baru logout)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('logout') === 'success') {
      showToast('Berhasil keluar dari sistem', 'info');
    }

    // Toggle Password
    document.getElementById('togglePassword').addEventListener('click', function () {
      const passInput = document.getElementById('password');
      const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passInput.setAttribute('type', type);
      this.innerHTML = type === 'password' ? '<i data-lucide="eye"></i>' : '<i data-lucide="eye-off"></i>';
      lucide.createIcons();
    });

    // Logic Form Login
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Memproses...';

      try {
        const user = await Auth.login(username, password);
        
        // TAMPILKAN DYNAMIC ISLAND SELAMAT DATANG
        showToast(`Selamat datang, ${user.nama}!`, 'success', 2000);

        // Delay sedikit agar toast terlihat sebelum pindah halaman
        setTimeout(() => {
          // ==================================================
          // REDIRECT SETELAH LOGIN SUKSES (SESUAI ROLE)
          // ==================================================
          if (user.role === 'pembaca_rekap') {
            window.location.href = 'rekap.html';
          } else if (user.role.startsWith('pengabsen_')) {
            window.location.href = 'absen.html'; // Pengabsen langsung ke Absen
          } else {
            window.location.href = 'index.html';
          }
        }, 1500);

      } catch (error) {
        // TAMPILKAN DYNAMIC ISLAND ERROR
        showToast(error.message || 'Username atau password salah', 'error');
        
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Masuk';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
