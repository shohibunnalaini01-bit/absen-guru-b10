<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Harian - Absen Guru MMU</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="assets/logo.png" alt="Logo" class="sidebar-logo-img">
        <span>AbsenGuru</span>
      </div>
      <div class="hijri-display" id="hijriSidebar"></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Akan dirender oleh JS sesuai role -->
    </nav>
    <div class="sidebar-footer">
      <div class="gregorian-display" id="gregorianSidebar"></div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-bar">
      <button class="menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button>
      <div class="page-title">
        <h1>Absensi Harian</h1>
        <p class="subtitle" id="todayDisplay"></p>
      </div>
      <div class="top-bar-right">
        <div class="real-time-clock" id="realTimeClock">00:00:00</div>
        <div class="user-info">
          <div class="user-name" id="userName">-</div>
          <div class="user-role" id="userRole">-</div>
        </div>
        <button class="btn-logout" id="btnLogout"><i data-lucide="log-out"></i> Keluar</button>
      </div>
    </header>

    <div class="content-area">
      
      <!-- Pengaturan Tanggal & Lembaga -->
      <div class="card" style="margin-bottom: 25px;">
        <div class="card-body" style="display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
            <label>Tanggal Absensi</label>
            <input type="date" id="tanggalAbsen" required>
          </div>
          <div class="form-group lembaga-select-wrapper" style="flex: 1; min-width: 200px; margin-bottom: 0; display: none;">
            <label>Lembaga</label>
            <select id="absenLembaga"><option value="">Pilih Lembaga</option></select>
          </div>
          <button class="btn btn-accent" id="btnHariIni" style="height: 46px;">
            <i data-lucide="calendar-check"></i> Hari Ini
          </button>
          <button class="btn btn-primary" id="btnLoadAbsen" style="height: 46px;">
            <i data-lucide="search"></i> Tampilkan
          </button>
        </div>
        <div style="margin-top: 10px; font-weight: 600; color: var(--primary);" id="hijriDisplay"></div>
      </div>

      <!-- Saklar Buka/Tutup Absensi (Hanya Admin) -->
      <div class="card" id="absenLockCard" style="margin-bottom: 25px; display: none; border-left: 5px solid var(--primary);">
        <div class="card-body" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
          <div>
            <h3 style="margin: 0; font-size: 1.1rem;">Kontrol Absensi Harian</h3>
            <p style="margin: 5px 0 0; font-size: 0.85rem; color: var(--text-secondary);" id="absenLockDesc">Absensi sedang dibuka untuk diisi</p>
          </div>
          <div style="display: flex; align-items: center; gap: 15px;">
            <span id="absenLockLabel" style="font-weight: 700; font-size: 1.1rem; color: var(--success);">BUKA</span>
            <button class="btn btn-danger" id="btnToggleAbsen" onclick="toggleAbsenStatus()">
              <i data-lucide="lock"></i> Kunci Absensi
            </button>
          </div>
        </div>
      </div>

      <!-- Peringatan Layar Terkunci (Untuk Pengabsen) -->
      <div id="absenLockedWarning" style="display: none; text-align: center; padding: 40px 20px; background: white; border-radius: 8px; border: 2px dashed var(--danger); margin-bottom: 25px;">
        <i data-lucide="shield-alert" style="width: 50px; height: 50px; color: var(--danger); margin-bottom: 15px;"></i>
        <h3 style="color: var(--danger); margin-bottom: 5px;">ABSENSI DIKUNCI</h3>
        <p style="color: var(--text-secondary);">Pengisian absensi untuk hari ini sudah ditutup oleh Admin.</p>
      </div>

      <!-- Container Matrix Absensi -->
      <div id="kelasContainerWrapper">
        <div id="kelasContainer">
          <div class="empty-state" style="padding: 50px 0; text-align: center; color: #64748b;">
            Silakan pilih tanggal dan lembaga, lalu klik Tampilkan
          </div>
        </div>

        <!-- Tombol Simpan & Hapus Semua -->
        <div style="margin-top: 30px; text-align: center; display: none; gap: 15px; justify-content: center;" id="btnActionWrapper">
          <button class="btn btn-danger" id="btnHapusAbsen"><i data-lucide="trash-2"></i> Hapus Absen Hari Ini</button>
          <button class="btn btn-primary" style="padding: 15px 40px; font-size: 1.1rem;" id="btnSimpanAbsen">
            <i data-lucide="save"></i> Simpan Absensi
          </button>
        </div>
      </div>

    </div>
  </main>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/hijri.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/absen.js"></script>
</body>
</html>
