<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Absen Guru MMU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="assets/logo.png" alt="Logo" class="sidebar-logo-img">
        <span>AbsenGuru</span>
      </div>
      <div class="hijri-display" id="hijriSidebar"></div>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item active"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a href="jadwal.html" class="nav-item"><i data-lucide="calendar-days"></i><span>Jadwal & Data</span></a>
      <a href="absen.html" class="nav-item"><i data-lucide="clipboard-check"></i><span>Absensi</span></a>
      <a href="rekap.html" class="nav-item"><i data-lucide="bar-chart-3"></i><span>Rekap Laporan</span></a>
      <a href="manajemen-user.html" class="nav-item nav-admin-only" style="display:none;"><i data-lucide="users"></i><span>Kelola User</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="gregorian-display" id="gregorianSidebar"></div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-bar">
      <button class="menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button>
      <div class="page-title">
        <h1>Dashboard</h1>
        <p class="subtitle" id="todayDisplay"></p>
      </div>
      <div class="top-bar-right">
        <!-- Jam Real-Time -->
        <div class="real-time-clock" id="realTimeClock">00:00:00</div>
        <div class="user-info">
          <div class="user-name" id="userName">-</div>
          <div class="user-role" id="userRole">-</div>
        </div>
        <button class="btn-logout" id="btnLogout"><i data-lucide="log-out"></i> Keluar</button>
      </div>
    </header>

    <div class="content-area">
      
      <!-- Rekap Lembaga Cards -->
      <div class="lembaga-stats-grid" id="lembagaStatsGrid">
        <!-- Akan dirender oleh JS -->
        <div class="empty-state" style="grid-column: 1/-1; padding: 40px 0;">Memuat data...</div>
      </div>

      <!-- Quick Actions -->
      <div class="card" style="margin-top: 25px;">
        <div class="card-header"><h3>Aksi Cepat</h3></div>
        <div class="card-body">
          <div class="quick-actions">
            <a href="absen.html" class="btn btn-primary"><i data-lucide="clipboard-check"></i> Input Absensi</a>
            <a href="jadwal.html" class="btn btn-accent"><i data-lucide="calendar-plus"></i> Kelola Jadwal</a>
            <a href="rekap.html" class="btn btn-secondary"><i data-lucide="file-text"></i> Lihat Rekap</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/hijri.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
