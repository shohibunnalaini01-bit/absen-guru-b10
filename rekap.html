<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Laporan - Absen Guru MMU</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/rekap.css">
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="assets/logo.png" alt="Logo" class="sidebar-logo-img">
        <span>AbsenGuru</span>
      </div>
      <div class="hijri-display" id="hijriSidebar"></div>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a href="jadwal.html" class="nav-item"><i data-lucide="calendar-days"></i><span>Jadwal & Data</span></a>
      <a href="absen.html" class="nav-item"><i data-lucide="clipboard-check"></i><span>Absensi</span></a>
      <a href="rekap.html" class="nav-item active"><i data-lucide="bar-chart-3"></i><span>Rekap Laporan</span></a>
      <a href="manajemen-user.html" class="nav-item nav-admin-only" style="display:none;"><i data-lucide="users"></i><span>Kelola User</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="gregorian-display" id="gregorianSidebar"></div>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Buka menu"><i data-lucide="menu"></i></button>
        <div class="page-title">
          <h1>Rekap Laporan</h1>
          <p class="subtitle" id="todayDisplay"></p>
        </div>
      </div>
      <div class="top-bar-right">
        <div class="user-info">
          <div class="user-name" id="userName">-</div>
          <div class="user-role" id="userRole">-</div>
        </div>
        <button class="btn-logout" id="btnLogout"><i data-lucide="log-out"></i> Keluar</button>
      </div>
    </header>

    <div class="content-area">

      <!-- Filter -->
      <div class="card rekap-filter-card">
        <div class="card-header">
          <h3>Filter Rekap</h3>
          <span class="card-chip" id="rekapRangeChip">-</span>
        </div>
        <div class="card-body">
          <div class="form-inline">
            <div class="form-group lembaga-select-wrapper">
              <label>Lembaga</label>
              <select id="rekapLembaga"><option value="">Semua Lembaga</option></select>
            </div>
            <div class="form-group fg-md">
              <label>Tanggal Mulai</label>
              <input type="date" id="rekapStart">
            </div>
            <div class="form-group fg-md">
              <label>Tanggal Selesai</label>
              <input type="date" id="rekapEnd">
            </div>
            <button class="btn btn-primary" id="btnTampilkan"><i data-lucide="search"></i> Tampilkan</button>
            <button class="btn btn-secondary" id="btnBulanIni"><i data-lucide="moon-star"></i> Bulan Ini</button>
          </div>
        </div>
      </div>

      <!-- Statistik Ringkas -->
      <div class="rekap-stats" id="rekapStats">
        <div class="rekap-stat-item">
          <span class="value" id="rsGuru">0</span>
          <span class="label">Total Guru</span>
        </div>
        <div class="rekap-stat-item">
          <span class="value" id="rsHariKerja">0</span>
          <span class="label">Hari Kerja</span>
        </div>
        <div class="rekap-stat-item">
          <span class="value" id="rsHadir">0</span>
          <span class="label">Total Hadir</span>
        </div>
        <div class="rekap-stat-item">
          <span class="value" id="rsRata">0%</span>
          <span class="label">Rata-rata</span>
        </div>
      </div>

      <!-- Tabel Rekap -->
      <div class="card">
        <div class="card-header">
          <h3>Rekap Kehadiran Guru</h3>
          <i data-lucide="bar-chart-3" class="header-icon"></i>
        </div>
        <div class="card-body">
          <div class="table-wrapper">
            <table class="rekap-table">
              <thead>
                <tr>
                  <th>No</th>
                  <th>Nama Guru</th>
                  <th>HK</th>
                  <th>Hadir</th>
                  <th>Sakit</th>
                  <th>Izin</th>
                  <th>Alpha</th>
                  <th>Tanpa Ket.</th>
                  <th>Persentase</th>
                </tr>
              </thead>
              <tbody id="rekapTable">
                <tr><td colspan="9" class="empty-state">Memuat data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Export -->
      <div class="export-section">
        <button class="btn-success" id="btnExportCsv">
          <i data-lucide="download"></i> Unduh CSV (Excel)
        </button>
      </div>

    </div>
  </main>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/hijri.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/rekap.js"></script>
</body>
</html>
